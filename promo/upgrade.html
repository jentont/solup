<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>SolUP — рулетка и апгрейд</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
<style>
  /* Ролик 8,5 с по мотивам рекламы RubUP: рулетка из широких карточек под цветными прожекторами →
     выигрыш крупно, вся рамка в золоте → апгрейд с кольцом шанса → «Улучшено ×2,86» → «Апай подарки в SolUP».
     Рисуется на 1280×672 и снимается с масштабом 1,5 → 1920×1008. */
  :root { --gold: #ffc93d; --gold-2: #ff9f1a; }
  #stage { width: 1280px; height: 672px; background: transparent; }
  body.bg-dark #stage { background: #000; }
  body.bg-green #stage { background: #00ff00; }
  html:has(body.bg-alpha), body.bg-alpha, body.bg-alpha #stage { background: transparent; }

  /* рамка: толстый скошенный борт и тёмный «экран» внутри */
  .panel {
    position: absolute; left: 24px; top: 24px; width: 1232px; height: 624px; border-radius: 50px;
    background: linear-gradient(180deg, #2b3170, #161a3c 40%, #10132c);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.22), inset 0 -2px 0 rgba(0, 0, 0, 0.4), 0 30px 80px rgba(0, 0, 0, 0.7);
  }
  .goldframe { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; z-index: 32;
    box-shadow: 0 0 0 3px #ffd34d, 0 0 50px 8px rgba(255, 190, 40, 0.7), inset 0 0 40px rgba(255, 190, 40, 0.5); }
  .screen {
    position: absolute; inset: 14px; border-radius: 38px; overflow: hidden;
    background: radial-gradient(90% 80% at 50% 0%, #1b2150 0%, #0f1230 60%, #0a0c22 100%);
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.45), inset 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .floor { position: absolute; left: 50%; bottom: -10px; width: 460px; height: 70px; margin-left: -230px; z-index: 30; pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 214, 90, 0.95), rgba(255, 159, 26, 0.35) 55%, transparent); filter: blur(2px); }
  .layer { position: absolute; inset: 0; }
  .tri { position: absolute; left: 50%; width: 0; height: 0; transform: translateX(-50%); z-index: 31;
    border-left: 14px solid transparent; border-right: 14px solid transparent; filter: drop-shadow(0 0 8px var(--gold)); }
  .tri.top { top: 0; border-top: 18px solid var(--gold); }
  .tri.bot { bottom: 0; border-bottom: 18px solid var(--gold); }

  /* ===== рулетка: широкие карточки, цветной свет заливает карточку сверху ===== */
  .strip { position: absolute; left: 0; top: 20px; height: 556px; filter: url(#mb); }
  .card {
    position: absolute; top: 0; width: 372px; height: 556px; border-radius: 30px; overflow: hidden;
    background:
      radial-gradient(90% 70% at 50% 0%, color-mix(in srgb, var(--sc) 55%, transparent), transparent 75%),
      linear-gradient(180deg, color-mix(in srgb, var(--sc) 22%, #171b3c), #12152f 70%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08), inset 0 2px 0 rgba(255, 255, 255, 0.12);
  }
  .card .beam { position: absolute; left: -10%; right: -10%; top: -20px; height: 470px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--sc) 85%, #fff 15%), color-mix(in srgb, var(--sc) 25%, transparent) 60%, transparent);
    clip-path: polygon(36% 0, 64% 0, 100% 100%, 0 100%); filter: blur(16px); opacity: 0.85; }
  .card .pool { position: absolute; left: 14%; right: 14%; top: 392px; height: 70px; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--sc) 80%, #fff 10%), transparent); filter: blur(3px); }
  .card img { position: absolute; left: 50%; top: 150px; width: 290px; height: 290px; margin-left: -145px; object-fit: contain; z-index: 1;
    filter: drop-shadow(0 22px 22px rgba(0, 0, 0, 0.55)); }
  .card .name { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 2; white-space: nowrap;
    padding: 10px 22px; border-radius: 999px; background: rgba(8, 10, 24, 0.82); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
    font: 800 21px var(--f-display); letter-spacing: -0.02em; opacity: 0; }
  .card .wborder { position: absolute; inset: 0; border-radius: inherit; z-index: 3; opacity: 0;
    box-shadow: inset 0 0 0 5px var(--gold), inset 0 0 50px rgba(255, 201, 61, 0.45); }
  .sc-violet { --sc: #8a5cff; } .sc-gold { --sc: #ffbf2e; } .sc-pink { --sc: #ff4fae; } .sc-blue { --sc: #3f9bff; } .sc-green { --sc: #2fd98a; }
  /* выигрышная карточка поверх рамки — при выигрыше вылезает за её края, как у образца */
  .hero { position: absolute; left: 430px; top: 34px; z-index: 33; opacity: 0; transform-origin: 50% 50%;
    box-shadow: 0 0 0 4px #ffd34d, 0 0 70px 14px rgba(255, 190, 40, 0.75); }
  .hero .name { opacity: 1; }
  .heroglow { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; z-index: 32; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgba(255, 200, 60, 0.45), rgba(255, 160, 30, 0.12) 50%, transparent 70%); }
  .rays { position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255, 214, 100, 0.42) 0 5deg, transparent 5deg 15deg);
    -webkit-mask: radial-gradient(closest-side, #000 12%, transparent 72%); mask: radial-gradient(closest-side, #000 12%, transparent 72%); }

  /* глянцевые кнопки: светлая полоса сверху, тёмное кольцо, свечение */
  .gloss {
    position: absolute; z-index: 25; display: flex; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
    border-radius: 22px; color: #fff; font: 900 32px var(--f-display); letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap;
  }
  .gloss::before { content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 46%; border-radius: 18px 18px 40% 40% / 18px 18px 14px 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.08)); }
  .gloss > * { position: relative; }
  .gloss.blue { background: linear-gradient(180deg, #6fd0ff 0%, #2ea6ff 48%, #1677e6 100%);
    box-shadow: 0 0 0 7px #0b0e28, 0 0 0 9px rgba(120, 190, 255, 0.35), 0 16px 40px rgba(40, 150, 255, 0.6); text-shadow: 0 2px 0 rgba(10, 60, 140, 0.5); }
  .gloss.gold { background: linear-gradient(180deg, #ffe98c 0%, #ffcc3a 50%, #f0a114 100%); color: #3a2400; text-transform: none; font-size: 28px;
    box-shadow: 0 0 0 2px rgba(255, 240, 180, 0.6), 0 12px 34px rgba(255, 180, 30, 0.5); }

  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; z-index: 40;
    border: 4px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 24px rgba(255, 255, 255, 0.5); opacity: 0; }
  .tap::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); }
  .spark { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 35; background: #fff6c8; opacity: 0;
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%); filter: drop-shadow(0 0 8px var(--gold)); }

  /* ===== апгрейд ===== */
  .ucard { position: absolute; top: 16px; width: 340px; height: 420px; border-radius: 28px; overflow: hidden;
    background: radial-gradient(90% 60% at 50% 30%, #262d64, #171b3d 75%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.07), inset 0 2px 0 rgba(255, 255, 255, 0.1);
    display: flex; flex-direction: column; align-items: center; padding-top: 22px; }
  .ucard img { width: 240px; height: 240px; object-fit: contain; filter: drop-shadow(0 18px 20px rgba(0, 0, 0, 0.6)); }
  .ucard b { margin-top: 8px; font: 800 30px var(--f-display); letter-spacing: -0.03em; }
  .ucard .sub { margin-top: 6px; display: flex; gap: 8px; align-items: center; font: 600 17px var(--f-body); color: #9aa0c8; }
  .ucard .sub i { font-style: normal; padding: 2px 9px; border-radius: 8px; background: rgba(255, 201, 61, 0.16); color: var(--gold); font: 800 14px var(--f-display); }
  .ucard .price { margin-top: 8px; display: flex; align-items: center; gap: 8px; font: 800 23px var(--f-display); }
  .ucard .tag { padding: 3px 10px; border-radius: 8px; background: rgba(255, 201, 61, 0.18); color: var(--gold); font: 800 15px var(--f-display); }
  .ucard .inv { display: none; color: #3dff9a; background: rgba(61, 255, 154, 0.14); }
  .ucard .wborder { position: absolute; inset: 0; border-radius: inherit; opacity: 0; box-shadow: inset 0 0 0 4px var(--gold), inset 0 0 40px rgba(255, 201, 61, 0.35); }

  .gauge { position: absolute; left: 400px; top: 14px; width: 404px; height: 404px; }
  .gauge svg { position: absolute; inset: 0; overflow: visible; }
  .gauge .core { position: absolute; inset: 54px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #262e6a, #0d1029 72%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06), 0 0 40px rgba(0, 0, 0, 0.5); display: grid; place-items: center; align-content: center; }
  .gauge .pct { white-space: nowrap; font: 900 52px var(--f-display); letter-spacing: -0.04em;
    background: linear-gradient(180deg, #fff, #c9cfee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gauge .lbl { font: 600 17px var(--f-body); color: #8d93c0; margin-top: -4px; }
  .gauge .prize { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -118px 0 0 -90px; object-fit: contain; opacity: 0;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.55)); }
  .gauge .done { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font: 800 22px var(--f-display); letter-spacing: -0.02em; color: var(--gold);
    text-shadow: 0 0 14px rgba(255, 190, 40, 0.6); opacity: 0; }
  .ptr { position: absolute; left: 202px; top: 202px; width: 0; height: 0; z-index: 3; }
  .ptr i { position: absolute; left: -18px; top: -214px; width: 36px; height: 40px;
    background: linear-gradient(180deg, #fff, #ffe9a6); clip-path: polygon(50% 100%, 0 0, 50% 22%, 100% 0); filter: drop-shadow(0 0 10px rgba(255, 220, 120, 0.9)); }

  .bar { position: absolute; left: 0; right: 0; top: 452px; height: 78px; display: grid; grid-template-columns: 340px 1fr 340px; gap: 16px; padding: 0 16px; }
  .bal { border-radius: 18px; background: #191d40; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06); padding: 13px 18px; position: relative; }
  .bal b { font: 700 18px var(--f-body); } .bal small { display: block; font: 500 14px var(--f-body); color: #7f86b5; }
  .bal .slider { position: absolute; left: 18px; right: 18px; bottom: 11px; height: 5px; border-radius: 3px; background: #2a3060; }
  .bal .slider::before { content: ""; position: absolute; left: -2px; top: -5px; width: 15px; height: 15px; border-radius: 50%; background: #fff; }
  .bal .val { position: absolute; right: 18px; top: 16px; font: 800 20px var(--f-display); display: flex; gap: 8px; align-items: center; }
  .bar .gloss { position: relative; z-index: 1; height: 78px; }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .chips span { border-radius: 14px; background: #191d40; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06);
    display: grid; place-items: center; font: 800 17px var(--f-display); color: #c9cdea; }

  /* монета стилями: маска из SVG в локальном файле браузер не грузит */
  .coin { display: inline-block; width: 0.85em; height: 0.85em; border-radius: 50%; vertical-align: -0.1em; -webkit-mask: none; mask: none;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc21f 50%, #c07800) !important; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), inset 0 -2px 0 rgba(0, 0, 0, 0.2); }

  /* ===== финал ===== */
  .spot { position: absolute; left: 50%; top: 40%; width: 900px; height: 520px; margin: -260px 0 0 -450px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(90, 110, 255, 0.35), rgba(255, 190, 60, 0.08) 60%, transparent); }
  .apai { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 900 46px var(--f-display); letter-spacing: -0.01em;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.6)); }
  .apai span { background: linear-gradient(180deg, #ffffff 30%, #c3cbef); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .apai em { font-style: normal; background: linear-gradient(180deg, #ffe98c, #ffb21a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo { position: absolute; left: 50%; top: 156px; width: 720px; height: 279px; margin-left: -360px; overflow: visible;
    filter: drop-shadow(0 0 30px rgba(80, 140, 255, 0.45)) drop-shadow(0 20px 30px rgba(0, 0, 0, 0.6)); }
  .swoosh { position: absolute; left: 50%; top: 394px; width: 430px; margin-left: -150px; overflow: visible; filter: drop-shadow(0 0 10px rgba(255, 200, 60, 0.7)); }
  .side { position: absolute; object-fit: contain; filter: drop-shadow(0 22px 24px rgba(0, 0, 0, 0.65)); }
  .side.far { filter: blur(2px) drop-shadow(0 14px 16px rgba(0, 0, 0, 0.6)); opacity: 0.85; }
  .glowp { position: absolute; width: 280px; height: 60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 200, 70, 0.55), transparent); }
  .mult { position: absolute; padding: 7px 16px; border-radius: 12px; background: rgba(255, 201, 61, 0.14); box-shadow: inset 0 0 0 2px rgba(255, 201, 61, 0.55);
    color: var(--gold); font: 800 24px var(--f-display); }
</style>
</head>

        <svg class="swoosh" id="swoosh" viewBox="0 0 430 80"><defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#ffe98c" /><stop offset="1" stop-color="#ffaa1a" /></linearGradient></defs>
          <path id="swPath" d="M10 34 C 120 78, 270 78, 380 24" fill="none" stroke="url(#sw)" stroke-width="16" stroke-linecap="round" />
          <path id="swHead" d="M352 10 L394 20 L376 56" fill="none" stroke="#ffb21a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
    </div>
    <div class="floor"></div>
    <i class="tri top" id="triT"></i><i class="tri bot" id="triB"></i>
    <div class="gloss blue" id="spinBtn" style="left: 50%; top: 452px; width: 330px; height: 84px">
      <svg width="34" height="34" viewBox="0 0 24 24"><path fill="#fff" d="M21.9 3.6 18.6 19c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 12.6 1.1 11c-1-.3-1.1-1 .2-1.5L20.6 2.1c.9-.3 1.6.2 1.3 1.5z"/></svg>
      <span>Крутить</span>
    </div>
    <div class="goldframe" id="goldframe"></div>
    <div class="heroglow" id="heroglow"></div>
    <div class="card sc-gold hero" id="hero"><div class="beam"></div><div class="pool"></div><img src="../webapp/public/gifts/lowrider.webp"><div class="name">Low Rider · 5 950 <i class="coin"></i></div></div>
    <div class="tap" id="tap"></div>
    <div id="sparks"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const params = new URLSearchParams(location.search);
document.body.className = "bg-" + (params.get("bg") || "dark");

const DUR = 8.5;
const T = {
  tap1: 0.6, spin: [0.72, 2.35], win1: [2.35, 3.2], toB: [3.15, 3.5],
  fill: [3.55, 4.35], tap2: 4.6, run: [4.72, 5.95], win2: [5.95, 6.8], toC: [6.75, 7.1],
};
const CHANCE = 0.3325;

// --- лента рулетки: [подарок, цвет прожектора] ---
const ITEMS = [
  ["perfumebottle", "pink"], ["tophat", "gold"], ["lunarsnake", "violet"], ["plushpepe", "green"], ["iongem", "blue"],
  ["lolpop", "pink"], ["durovscap", "gold"], ["swisswatch", "violet"], ["heartlocket", "pink"], ["mightyarm", "gold"],
  ["crystalball", "violet"], ["jellybunny", "blue"], ["preciouspeach", "pink"], ["signetring", "violet"], ["lowrider", "gold"],
  ["bunnymuffin", "pink"], ["electricskull", "blue"], ["genielamp", "violet"],
];
const WIN = 14, STEP = 384, CENTER = 602;
const strip = $("#strip");
const cards = ITEMS.map(([img, sc], i) => {
  const d = document.createElement("div");
  d.className = `card sc-${sc}`;
  d.style.left = i * STEP + "px";
  d.innerHTML = `<div class="beam"></div><div class="pool"></div><img src="${GIFT(img)}">` +
    (i === WIN ? `<div class="name">Low Rider · 5 950 <i class="coin"></i></div><div class="wborder"></div>` : "");
  strip.appendChild(d);
  return d;
});
const off0 = 1 * STEP + 186 - CENTER;
const off1 = WIN * STEP + 186 - CENTER + 16;
const offAt = (t) => lerp(off0, off1, ease.out5(seg(t, T.spin[0], T.spin[1])));

// --- деления вокруг кольца ---
{
  const g = $("#ticks");
  for (let i = 0; i < 72; i++) {
    const a = (i * 5 * Math.PI) / 180, r1 = 190, r2 = i % 6 ? 196 : 200;
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", 202 + r1 * Math.sin(a)); l.setAttribute("y1", 202 - r1 * Math.cos(a));
    l.setAttribute("x2", 202 + r2 * Math.sin(a)); l.setAttribute("y2", 202 - r2 * Math.cos(a));
    l.setAttribute("stroke", i % 6 ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.3)"); l.setAttribute("stroke-width", "2");
    g.appendChild(l);
  }
}
// золотая дуга шанса стоит снизу по центру, как у образца: от (180 − шанс·180)° до (180 + шанс·180)°
const ARC_START = 180 - CHANCE * 180;
function needleAt(t) {
  const stop = 360 * 4 + ARC_START + CHANCE * 360 * 0.62; // четыре оборота и остановка внутри дуги
  return ease.out5(seg(t, T.run[0], T.run[1])) * stop;
}

// --- искры ---
const SPARKS = Array.from({ length: 9 }, () => {
  const d = document.createElement("div");
  d.className = "spark";
  $("#sparks").appendChild(d);
  return d;
});
function sparks(t, a, cx, cy, rx, ry) {
  const r = rand(7);
  SPARKS.forEach((el, i) => {
    const ang = r() * Math.PI * 2, dist = 0.55 + r() * 0.45, d = i * 0.06, sz = r();
    const k = seg(t, a + d, a + d + 0.75);
    const s = Math.sin(k * Math.PI);
    css(el, { left: cx + Math.cos(ang) * rx * dist + "px", top: cy + Math.sin(ang) * ry * dist - k * 20 + "px", opacity: s,
      transform: `scale(${0.3 + s * (0.7 + sz * 0.6)}) rotate(${k * 120}deg)` });
  });
}

// --- звуки ---
const SFX = [{ t: T.tap1, k: "tap" }];
{
  let prev = Math.floor((offAt(T.spin[0]) + CENTER) / STEP);
  for (let t = T.spin[0]; t <= T.spin[1]; t += 0.002) {
    const idx = Math.floor((offAt(t) + CENTER) / STEP);
    if (idx !== prev) { SFX.push({ t, k: "tick" }); prev = idx; }
  }
  SFX.push({ t: T.win1[0], k: "win" }, { t: T.toB[0], k: "whoosh" }, { t: T.tap2, k: "tap" });
  let p = 0;
  for (let t = T.run[0]; t <= T.run[1]; t += 0.002) {
    const n = Math.floor(needleAt(t) / 30);
    if (n !== p) { SFX.push({ t, k: "tick" }); p = n; }
  }
  SFX.push({ t: T.win2[0], k: "win2" }, { t: T.toC[0] + 0.05, k: "pop" }, { t: T.toC[0] + 0.5, k: "whoosh" });
}
window.SFX = SFX;

function tapAt(t, at, x, y) {
  const k = seg(t, at - 0.12, at + 0.35);
  if (k <= 0 || k >= 1) return false;
  const press = seg(t, at - 0.12, at), grow = seg(t, at, at + 0.35);
  css($("#tap"), { left: x + "px", top: y + "px", opacity: grow ? 1 - grow : press,
    transform: `scale(${grow ? 1 + grow * 0.9 : 1.4 - press * 0.4})` });
  return true;
}
const pctText = (k) => (k * 100).toFixed(2).replace(".", ",") + " %";
const polar = (deg, r) => [202 + r * Math.sin((deg * Math.PI) / 180), 202 - r * Math.cos((deg * Math.PI) / 180)];

function render(t) {
  const pin = ease.back(seg(t, 0, 0.45));
  css($("#panel"), { opacity: seg(t, 0, 0.25), transform: `scale(${0.92 + 0.08 * pin})` });
  const triV = 1 - seg(t, T.toB[0], T.toB[1]);
  css($("#triT"), { opacity: triV }); css($("#triB"), { opacity: triV });

  // золотая рамка вспыхивает на выигрышах
  const g1 = Math.sin(seg(t, T.win1[0], T.win1[1] + 0.2) * Math.PI);
  const g2 = Math.sin(seg(t, T.win2[0], T.win2[1] + 0.1) * Math.PI);
  css($("#goldframe"), { opacity: Math.max(g1, g2) });

  // === A: рулетка ===
  const aV = 1 - seg(t, T.toB[0], T.toB[1]);
  css($("#sA"), { opacity: aV, display: aV > 0 ? "block" : "none" });
  if (aV > 0) {
    const off = offAt(t);
    const v = Math.abs(offAt(t + 0.016) - off) / 0.016;
    css(strip, { transform: `translateX(${-off}px)` });
    $("#mbBlur").setAttribute("stdDeviation", `${clamp(v / 170, 0, 48)} 0`); // размытие только по горизонтали
    const pop = ease.back(seg(t, T.win1[0], T.win1[0] + 0.45));
    const dim = seg(t, T.win1[0], T.win1[0] + 0.3);
    cards.forEach((c, i) => {
      if (i === WIN) {
        // на выигрыше карточку в ленте подменяет герой поверх рамки
        css(c, { opacity: t >= T.win1[0] ? 0 : 1 });
      } else css(c, { opacity: 1 - 0.5 * dim, filter: `blur(${dim * 3}px) brightness(${1 - 0.3 * dim})`, transform: "none", zIndex: 1 });
    });
    css($("#raysA"), { left: CENTER + "px", top: "300px", opacity: dim, transform: `rotate(${t * 16}deg) scale(${0.6 + 0.4 * pop})` });
    // герой: стоит ровно на месте выигрышной карточки и вырастает за края рамки
    const heroOn = t >= T.win1[0] && t < T.toB[1];
    const heroX = WIN * STEP - offAt(t) + 14 + 0; // позиция карточки в координатах рамки
    const out = seg(t, T.toB[0] - 0.05, T.toB[1]);
    css($("#hero"), { display: heroOn ? "block" : "none", left: heroX + "px", opacity: 1 - out,
      transform: `scale(${1 + 0.2 * pop - 0.15 * out}) translateY(${-6 * pop}px)` });
    css($(".name", $("#hero")), { opacity: seg(t, T.win1[0] + 0.15, T.win1[0] + 0.4) });
    css($("#heroglow"), { display: heroOn ? "block" : "none", left: heroX + 186 + "px", top: "312px", opacity: dim * (1 - out) });
    const bk = seg(t, T.tap1 + 0.05, T.tap1 + 0.35);
    css($("#spinBtn"), { opacity: (1 - bk) * aV, transform: `translateX(-50%) translateY(${bk * 40}px) scale(${t < T.tap1 ? 1 - 0.06 * seg(t, T.tap1 - 0.1, T.tap1) : 1})` });
  } else {
    css($("#spinBtn"), { opacity: 0 });
    css($("#hero"), { display: "none" }); css($("#heroglow"), { display: "none" });
  }

  // === B: апгрейд ===
  const bV = seg(t, T.toB[0], T.toB[1]) * (1 - seg(t, T.toC[0], T.toC[1]));
  css($("#sB"), { opacity: bV, display: bV > 0 ? "block" : "none" });
  if (bV > 0) {
    const inK = ease.out3(seg(t, T.toB[0], T.toB[1] + 0.15));
    css($("#from"), { transform: `translateX(${(1 - inK) * -60}px)` });
    css($("#to"), { transform: `translateX(${(1 - inK) * 60}px)` });
    css($("#gauge"), { transform: `scale(${0.85 + 0.15 * inK})` });
    // дуга растёт от низа в обе стороны
    const fill = ease.out3(seg(t, T.fill[0], T.fill[1])) * CHANCE;
    const L = 2 * Math.PI * 166;
    $("#arc").setAttribute("stroke-dasharray", `${fill * L} ${L}`);
    $("#arc").setAttribute("transform", `rotate(${90 - fill * 180} 202 202)`);
    const [tx, ty] = polar(180 + fill * 180, 166);
    $("#tip").setAttribute("cx", tx); $("#tip").setAttribute("cy", ty);
    css($("#tip"), { opacity: fill > 0.005 ? 1 : 0 });
    $("#pct").textContent = pctText(fill);
    css($("#ptr"), { transform: `rotate(${needleAt(t)}deg)`, opacity: seg(t, T.fill[1] - 0.25, T.fill[1]) });
    const pressed = t > T.tap2 && t < T.win2[0];
    css($("#upBtn"), { transform: `scale(${1 - 0.05 * Math.sin(seg(t, T.tap2 - 0.1, T.tap2 + 0.15) * Math.PI)})`, filter: pressed ? "brightness(0.85)" : "none" });
    // выигрыш
    const w = ease.back(seg(t, T.win2[0], T.win2[0] + 0.45));
    const wv = seg(t, T.win2[0], T.win2[0] + 0.25);
    css($("#core"), { opacity: 1 - wv });
    css($("#prize"), { opacity: wv, transform: `scale(${0.4 + 0.6 * w})` });
    css($("#done"), { opacity: wv, transform: `translateY(${(1 - w) * 12}px)` });
    css($("#raysB"), { opacity: wv, transform: `rotate(${t * 18}deg) scale(${0.6 + 0.4 * w})` });
    css($("#toB"), { opacity: wv });
    css($("#to"), { boxShadow: `0 0 ${60 * wv}px rgba(255, 190, 40, ${0.45 * wv})`, zIndex: 2 });
    css($("#from"), { opacity: 1 - 0.5 * wv, filter: `grayscale(${wv}) brightness(${1 - 0.25 * wv})` });
    css($("#tagX"), { display: t < T.win2[0] + 0.2 ? "inline-block" : "none" });
    css($("#tagInv"), { display: t >= T.win2[0] + 0.2 ? "inline-block" : "none" });
  }

  // === C: финал ===
  const cV = seg(t, T.toC[0], T.toC[1]);
  css($("#sC"), { opacity: cV, display: cV > 0 ? "block" : "none" });
  if (cV > 0) {
    const s0 = T.toC[0];
    const lk = ease.back(seg(t, s0 + 0.08, s0 + 0.55));
    css($("#logo"), { transform: `scale(${0.55 + 0.45 * lk}) rotate(${(1 - lk) * -4}deg)`, opacity: seg(t, s0 + 0.08, s0 + 0.25) });
    rise($("#apai"), t, s0, 0.4, 24);
    const sw = ease.out3(seg(t, s0 + 0.45, s0 + 0.85));
    $("#swPath").setAttribute("stroke-dasharray", `${sw * 430} 430`);
    css($("#swHead"), { opacity: seg(t, s0 + 0.8, s0 + 0.9) });
    const bob = (ph, a = 8) => `translateY(${Math.sin(t * 2.4 + ph) * a}px) rotate(${Math.sin(t * 1.6 + ph) * 5}deg)`;
    css($("#cL"), { transform: bob(0) + ` scale(${ease.back(seg(t, s0 + 0.05, s0 + 0.5))})` });
    css($("#cR"), { transform: bob(2) + ` scale(${ease.back(seg(t, s0 + 0.12, s0 + 0.57))})` });
    css($("#cX"), { opacity: seg(t, s0 + 0.5, s0 + 0.7), transform: `scale(${ease.back(seg(t, s0 + 0.5, s0 + 0.8))})` });
    css($("#cTL"), { transform: bob(1, 5) + ` scale(${ease.back(seg(t, s0 + 0.2, s0 + 0.6))})` });
    css($("#cTR"), { transform: bob(3, 5) + ` scale(${ease.back(seg(t, s0 + 0.25, s0 + 0.65))})` });
  }

  // нажатия и искры
  if (!tapAt(t, T.tap1, 616, 494) && !tapAt(t, T.tap2, 616, 505)) css($("#tap"), { opacity: 0 });
  if (t >= T.toC[0] + 0.7) sparks(t, T.toC[0] + 0.8, 1010, 392, 60, 40);
  else if (t >= T.win2[0] - 0.05) sparks(t, T.win2[0], 616, 230, 230, 190);
  else sparks(t, T.win1[0], 616, 300, 260, 250);
}

boot(DUR, render);
</script>
