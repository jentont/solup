<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>SolUP — рекламная вставка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Onest:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
<style>
  /* Вставка 6,6 с: рулетка → выигрыш → апгрейд → выигрыш → логотип и поиск бота.
     Рисуется на 1280×672 и снимается с масштабом 1,5 → 1920×1008, как у образцов. */
  #stage { width: 1280px; height: 672px; background: transparent; }
  body.bg-dark #stage { background: #050507; }
  body.bg-green #stage { background: #00ff00; }
  /* в режиме прозрачности фон страницы тоже прозрачный, иначе в кадр попадёт чёрный из common.css */
  html:has(body.bg-alpha), body.bg-alpha, body.bg-alpha #stage { background: transparent; }

  .panel {
    position: absolute; left: 24px; top: 24px; width: 1232px; height: 624px; border-radius: 52px; overflow: hidden;
    background: radial-gradient(70% 60% at 50% 0%, #22324a 0%, #15161c 55%, #0e0f13 100%);
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .panel::before {
    content: ""; position: absolute; inset: 0; background: #fff; opacity: 0.05;
    -webkit-mask: url(../webapp/public/brand/pattern.png) 0 0 / 280px 280px repeat; mask: url(../webapp/public/brand/pattern.png) 0 0 / 280px 280px repeat;
  }
  .glow-floor { position: absolute; left: 20%; right: 20%; bottom: -60px; height: 120px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(41, 151, 255, 0.45), transparent); }

  .layer { position: absolute; inset: 0; }

  /* окно рулетки */
  .rwin { position: absolute; left: 66px; top: 74px; width: 1100px; height: 440px; overflow: hidden; border-radius: 34px; }
  .rwin::before, .rwin::after { content: ""; position: absolute; top: 0; bottom: 0; width: 120px; z-index: 3; pointer-events: none; }
  .rwin::before { left: 0; background: linear-gradient(90deg, #14161c, transparent); }
  .rwin::after { right: 0; background: linear-gradient(-90deg, #14161c, transparent); }
  .strip { position: absolute; left: 0; top: 20px; height: 400px; }

  /* большая карточка подарка */
  .rc {
    position: absolute; top: 0; width: 300px; height: 400px; border-radius: 32px; overflow: hidden;
    background: radial-gradient(90% 60% at 50% 100%, color-mix(in srgb, var(--rc) 45%, transparent), transparent 70%), #1c1d24;
    border: 2px solid color-mix(in srgb, var(--rc) 55%, rgba(255, 255, 255, 0.08));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .rc::after { content: ""; position: absolute; left: 24%; right: 24%; bottom: 0; height: 6px; border-radius: 6px 6px 0 0; background: var(--rc); }
  .rc img { width: 210px; height: 210px; object-fit: contain; filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.55)); }
  .rc .n { font: 700 20px var(--f-body); color: #e7e7ea; }
  .rc .v { font: 800 22px var(--f-display); letter-spacing: -0.02em; }
  .rc .v .coin { width: 0.9em; height: 0.9em; }

  .marker { position: absolute; left: 50%; width: 0; height: 0; transform: translateX(-50%); z-index: 4;
    border-left: 16px solid transparent; border-right: 16px solid transparent; }
  .marker.top { top: 0; border-top: 20px solid var(--brand); filter: drop-shadow(0 0 10px var(--brand)); }
  .marker.bot { bottom: 0; border-bottom: 20px solid var(--brand); filter: drop-shadow(0 0 10px var(--brand)); }

  /* кнопки и нажатие */
  .pbtn {
    position: absolute; left: 50%; transform: translateX(-50%); padding: 22px 56px; border-radius: 999px; z-index: 5;
    background: var(--brand); color: #fff; font: 800 34px var(--f-display); letter-spacing: -0.03em; white-space: nowrap;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.14), 0 14px 40px rgba(41, 151, 255, 0.55);
  }
  .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; z-index: 9;
    border: 4px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 24px rgba(255, 255, 255, 0.5); }
  .tap::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); }

  /* луч света над выигрышем */
  .beam { position: absolute; width: 420px; height: 520px; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(150, 205, 255, 0.55), rgba(41, 151, 255, 0.12) 55%, transparent 80%);
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); filter: blur(6px); }
  .spark { position: absolute; width: 18px; height: 18px; z-index: 6; }
  .spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; border-radius: 2px; transform: translate(-50%, -50%); }
  .spark::before { width: 18px; height: 3px; } .spark::after { width: 3px; height: 18px; }

  /* апгрейд */
  .gauge { position: absolute; left: 466px; top: 70px; width: 300px; height: 300px; }
  .gauge svg { position: absolute; inset: 0; overflow: visible; }
  .gauge .mark { position: absolute; left: 75px; top: 75px; width: 150px; height: 150px; }
  .gauge .pct { position: absolute; left: 0; right: 0; top: 232px; text-align: center; font: 800 26px var(--f-display); letter-spacing: -0.03em; }
  .needle { position: absolute; left: 150px; top: 150px; width: 0; height: 0; }
  .needle i { position: absolute; left: -13px; top: -178px; border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 22px solid #fff; filter: drop-shadow(0 0 6px #fff); }

  /* финал: логотип, слоган, поиск */
  .logo { position: absolute; left: 50%; top: 46px; width: 400px; transform: translateX(-50%); }
  .slogan { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font: 700 44px/1 var(--f-hand); color: var(--brand-ink); }
  .search {
    position: absolute; left: 50%; top: 300px; width: 680px; height: 74px; margin-left: -340px; border-radius: 22px;
    background: #24252c; border: 2px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; gap: 16px; padding: 0 24px;
    font: 700 32px var(--f-body);
  }
  .search svg { flex: none; opacity: 0.6; }
  .caret { display: inline-block; width: 3px; height: 34px; background: var(--brand); margin-left: 3px; vertical-align: -6px; }
  .result {
    position: absolute; left: 50%; top: 394px; width: 600px; height: 92px; margin-left: -300px; border-radius: 22px;
    background: #2a2c36; border: 2px solid rgba(41, 151, 255, 0.35); display: flex; align-items: center; gap: 18px; padding: 0 22px;
  }
  .result img { width: 62px; height: 62px; border-radius: 50%; }
  .result b { font: 800 28px var(--f-display); letter-spacing: -0.02em; }
  .result .verified { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); margin-left: 8px; vertical-align: 2px; }
  .result small { display: block; font: 600 20px var(--f-body); color: var(--hint); }
  .side { position: absolute; width: 190px; height: 190px; object-fit: contain; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.6)); }
</style>
</head>
<body class="bg-dark">
<div id="stage">
  <div class="panel">
    <div class="glow-floor"></div>

    <!-- 1. кейс и рулетка -->
    <div class="layer" id="sA">
      <div class="rwin" id="rwin">
        <div class="strip" id="strip"></div>
        <i class="marker top"></i><i class="marker bot"></i>
      </div>
      <div class="pbtn" id="btnOpen" style="top: 470px">Открыть бесплатно</div>
    </div>

    <!-- 2. апгрейд -->
    <div class="layer" id="sB">
      <div class="beam" id="beamB"></div>
      <div class="rc r-rare" id="upFrom" style="left: 126px; top: 94px"><img src="../webapp/public/gifts/crystalball.webp" /><div class="n">Crystal Ball</div><div class="v">1 200 <i class="coin"></i></div></div>
      <div class="rc r-legendary" id="upTo" style="left: 806px; top: 94px"><img src="../webapp/public/gifts/heartlocket.webp" /><div class="n">Heart Locket</div><div class="v">30 000 <i class="coin"></i></div></div>
      <div class="gauge">
        <svg viewBox="0 0 300 300">
          <circle cx="150" cy="150" r="150" fill="none" stroke="#2a2b33" stroke-width="16" />
          <circle id="arc" cx="150" cy="150" r="150" fill="none" stroke="var(--brand)" stroke-width="16" stroke-linecap="round"
                  transform="rotate(-90 150 150)" stroke-dasharray="0 943" style="filter: drop-shadow(0 0 10px var(--brand))" />
        </svg>
        <img class="mark" id="mark" src="mark.svg" />
        <div class="needle" id="needle"><i></i></div>
      </div>
      <div class="pbtn" id="btnUp" style="top: 470px">Улучшить</div>
    </div>

    <!-- 3. логотип и поиск -->
    <div class="layer" id="sC">
      <img class="side" id="sideL" src="../webapp/public/gifts/crystalball.webp" style="left: 70px; top: 300px" />
      <img class="side" id="sideR" src="../webapp/public/gifts/heartlocket.webp" style="right: 70px; top: 290px" />
      <img class="logo" id="logo" src="../webapp/public/brand/solup-word-dark.svg" />
      <div class="slogan" id="slogan">твой подарок может больше</div>
      <div class="search" id="search">
        <svg width="34" height="34" viewBox="0 0 24 24"><path fill="#fff" d="M10.5 3a7.5 7.5 0 0 1 6 12l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <span id="typed"></span><i class="caret" id="caret"></i>
      </div>
      <div class="result" id="result">
        <img src="avatar.png" />
        <div><b>SolUP</b><span class="verified"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#fff" d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4 18.7 7z"/></svg></span><small id="handle"></small></div>
      </div>
    </div>

    <div class="tap" id="tap"></div>
    <div class="spark" id="sp1"></div><div class="spark" id="sp2"></div><div class="spark" id="sp3"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
// Юзернейм бота в поиске — поменяйте на настоящий
const BOT = "@Solik_GameBot";

const params = new URLSearchParams(location.search);
document.body.className = "bg-" + (params.get("bg") || "dark");

const DUR = 6.6;
const T = {
  tap1: 0.75, spin: [0.9, 2.45], win1: [2.45, 3.05], toB: [3.0, 3.35],
  tap2: 3.5, fill: [3.6, 4.3], win2: [4.35, 4.95], toC: [4.95, 5.3], type: [5.35, 5.9], result: 5.95, tap3: 6.25,
};

// --- лента рулетки ---
const ITEMS = [
  ["lootbag", "Loot Bag", "15 000", "legendary"], ["swisswatch", "Swiss Watch", "6 000", "epic"], ["plushpepe", "Plush Pepe", "600 000", "legendary"],
  ["jellybunny", "Jelly Bunny", "900", "uncommon"], ["lunarsnake", "Lunar Snake", "380", "common"], ["lovepotion", "Love Potion", "1 300", "rare"],
  ["toybear", "Toy Bear", "3 000", "epic"], ["lolpop", "Lol Pop", "400", "common"], ["genielamp", "Genie Lamp", "6 500", "epic"],
  ["witchhat", "Witch Hat", "700", "uncommon"], ["eternalrose", "Eternal Rose", "2 000", "rare"], ["hexpot", "Hex Pot", "550", "uncommon"],
  ["durovscap", "Durov's Cap", "120 000", "legendary"], ["homemadecake", "Homemade Cake", "400", "common"], ["signetring", "Signet Ring", "5 500", "epic"],
  ["spyagaric", "Spy Agaric", "600", "uncommon"], ["preciouspeach", "Precious Peach", "50 000", "legendary"], ["recordplayer", "Record Player", "1 400", "rare"],
  ["crystalball", "Crystal Ball", "1 200", "rare"], ["vintagecigar", "Vintage Cigar", "4 000", "epic"], ["trappedheart", "Trapped Heart", "1 500", "rare"],
  ["deskcalendar", "Desk Calendar", "350", "common"], ["nekohelmet", "Neko Helmet", "4 500", "epic"],
];
const WIN = 18, STEP = 320, CENTER = 550;
const strip = $("#strip");
const cards = ITEMS.map(([img, name, val, rar], i) => {
  const d = document.createElement("div");
  d.className = `rc r-${rar}`;
  d.style.left = i * STEP + "px";
  d.innerHTML = `<img src="${GIFT(img)}"><div class="n">${name}</div><div class="v">${val} <i class="coin"></i></div>`;
  strip.appendChild(d);
  return d;
});
const off0 = 1 * STEP + 150 - CENTER;            // в начале по центру вторая карточка
const off1 = WIN * STEP + 150 - CENTER + 22;     // в конце — выигрыш, чуть мимо середины
const offAt = (t) => lerp(off0, off1, ease.out5(seg(t, T.spin[0], T.spin[1])));

// --- звуки: момент, когда очередная карточка проходит под маркером ---
const SFX = [{ t: T.tap1, k: "tap" }];
{
  let prev = Math.floor((offAt(T.spin[0]) + CENTER) / STEP);
  for (let t = T.spin[0]; t <= T.spin[1]; t += 0.002) {
    const idx = Math.floor((offAt(t) + CENTER) / STEP);
    if (idx !== prev) { SFX.push({ t, k: "tick" }); prev = idx; }
  }
}
SFX.push({ t: T.win1[0], k: "win" }, { t: T.tap2, k: "tap" }, { t: T.fill[0], k: "whoosh" }, { t: T.win2[0], k: "win2" },
         { t: T.toC[0] + 0.05, k: "pop" });
for (let i = 0; i < BOT.length; i++) SFX.push({ t: lerp(T.type[0], T.type[1], i / BOT.length), k: "key" });
SFX.push({ t: T.result, k: "pop" }, { t: T.tap3, k: "tap" });
window.SFX = SFX;

// --- нажатие ---
function tapAt(t, at, x, y) {
  const k = seg(t, at - 0.12, at + 0.35);
  if (k <= 0 || k >= 1) return false;
  const press = seg(t, at - 0.12, at);
  const grow = seg(t, at, at + 0.35);
  css($("#tap"), { left: x + "px", top: y + "px", opacity: grow ? 1 - grow : press,
    transform: `scale(${grow ? 1 + grow * 0.9 : 1.4 - press * 0.4})` });
  return true;
}

function sparks(t, a, cx, cy) {
  [["#sp1", -170, -120, 0], ["#sp2", 160, -60, 0.1], ["#sp3", 120, 170, 0.2]].forEach(([id, dx, dy, d]) => {
    const k = seg(t, a + d, a + d + 0.6);
    const s = Math.sin(k * Math.PI);
    css($(id), { left: cx + dx + "px", top: cy + dy + "px", opacity: s, transform: `scale(${0.4 + s})` });
  });
}

function render(t) {
  // панель появляется
  const pin = ease.back(seg(t, 0, 0.45));
  css($(".panel"), { opacity: seg(t, 0, 0.25), transform: `scale(${0.92 + 0.08 * pin})` });

  // === сцена A: рулетка ===
  const aVis = 1 - seg(t, T.toB[0], T.toB[1]);
  css($("#sA"), { opacity: aVis, display: aVis > 0 ? "block" : "none" });
  if (aVis > 0) {
    const off = offAt(t);
    const v = Math.abs(offAt(t + 0.016) - off) / 0.016; // скорость, px/с — для размытия в движении
    css(strip, { transform: `translateX(${-off}px)`, filter: `blur(${clamp(v / 900, 0, 9)}px)` });
    const pop = ease.back(seg(t, T.win1[0], T.win1[0] + 0.35));
    cards.forEach((c, i) => {
      const win = i === WIN;
      const dim = seg(t, T.win1[0], T.win1[0] + 0.3);
      css(c, win
        ? { transform: `scale(${1 + 0.12 * pop}) translateY(${-8 * pop}px)`, zIndex: 2, boxShadow: `0 0 ${60 * pop}px rgba(41,151,255,${0.6 * pop})` }
        : { opacity: 1 - 0.65 * dim, transform: "none", zIndex: 1, boxShadow: "none" });
    });
    // кнопка: нажата и уезжает вниз на время прокрутки
    const bk = seg(t, T.tap1 + 0.05, T.tap1 + 0.3);
    css($("#btnOpen"), { opacity: 1 - bk, transform: `translateX(-50%) scale(${t < T.tap1 ? 1 - 0.06 * seg(t, T.tap1 - 0.1, T.tap1) : 1 - 0.1 * bk})` });
  }

  // === сцена B: апгрейд ===
  const bVis = seg(t, T.toB[0], T.toB[1]) * (1 - seg(t, T.toC[0], T.toC[1]));
  css($("#sB"), { opacity: bVis, display: bVis > 0 ? "block" : "none" });
  if (bVis > 0) {
    const chance = 0.42;
    const fill = ease.out3(seg(t, T.fill[0], T.fill[0] + 0.35)) * chance;
    $("#arc").setAttribute("stroke-dasharray", `${fill * 943} 943`);
    // стрелка: пять оборотов с замедлением, останавливается внутри синей дуги
    const spin = ease.out5(seg(t, T.fill[0], T.fill[1]));
    css($("#needle"), { transform: `rotate(${spin * (360 * 3 + 0.27 * 360)}deg)` });
    const win = ease.back(seg(t, T.win2[0], T.win2[0] + 0.35));
    css($("#mark"), { transform: `scale(${1 + 0.15 * Math.sin(seg(t, T.win2[0], T.win2[0] + 0.4) * Math.PI)})` });
    css($("#upTo"), { transform: `scale(${1 + 0.14 * win}) translateY(${-10 * win}px)`, boxShadow: `0 0 ${70 * win}px rgba(255,159,10,${0.55 * win})`, zIndex: 2 });
    css($("#upFrom"), { opacity: 1 - 0.65 * seg(t, T.win2[0], T.win2[0] + 0.3), transform: `scale(${1 - 0.06 * seg(t, T.win2[0], T.win2[0] + 0.3)})` });
    css($("#beamB"), { left: "746px", top: "-40px", opacity: win * 0.9 });
    const bk = seg(t, T.tap2 + 0.05, T.tap2 + 0.3);
    css($("#btnUp"), { opacity: 1 - bk, transform: `translateX(-50%) scale(${t < T.tap2 ? 1 - 0.06 * seg(t, T.tap2 - 0.1, T.tap2) : 1 - 0.1 * bk})` });
  }

  // === сцена C: логотип и поиск ===
  const cVis = seg(t, T.toC[0], T.toC[1]);
  css($("#sC"), { opacity: cVis, display: cVis > 0 ? "block" : "none" });
  if (cVis > 0) {
    const lk = ease.back(seg(t, T.toC[0], T.toC[0] + 0.45));
    css($("#logo"), { transform: `translateX(-50%) scale(${0.7 + 0.3 * lk})`, opacity: seg(t, T.toC[0], T.toC[0] + 0.2) });
    rise($("#slogan"), t, T.toC[0] + 0.2, 0.4, 16);
    css($("#slogan"), { transform: $("#slogan").style.transform + " rotate(-3deg)" });
    rise($("#search"), t, T.toC[0] + 0.15, 0.35, 20);
    const n = Math.round(BOT.length * seg(t, T.type[0], T.type[1]));
    $("#typed").textContent = BOT.slice(0, n);
    css($("#caret"), { opacity: t > T.result ? 0 : (Math.floor(t * 3) % 2 ? 1 : 0.2) });
    const rk = ease.back(seg(t, T.result, T.result + 0.3));
    css($("#result"), { opacity: seg(t, T.result, T.result + 0.15), transform: `translateY(${(1 - rk) * 14}px) scale(${t > T.tap3 ? 1 - 0.04 * Math.sin(seg(t, T.tap3, T.tap3 + 0.3) * Math.PI) : 1})` });
    $("#handle").textContent = BOT;
    const bob = (ph) => `translateY(${Math.sin(t * 2.4 + ph) * 8}px) rotate(${Math.sin(t * 1.6 + ph) * 6}deg)`;
    css($("#sideL"), { transform: bob(0) + ` scale(${ease.back(seg(t, T.toC[0] + 0.1, T.toC[0] + 0.5))})` });
    css($("#sideR"), { transform: bob(2) + ` scale(${ease.back(seg(t, T.toC[0] + 0.15, T.toC[0] + 0.55))})` });
  }

  // нажатия и искры
  if (!tapAt(t, T.tap1, 616, 506) && !tapAt(t, T.tap2, 616, 506) && !tapAt(t, T.tap3, 800, 440)) css($("#tap"), { opacity: 0 });
  if (t > T.win2[0] - 0.05) sparks(t, T.win2[0], 956, 290);
  else sparks(t, T.win1[0], 616, 290);
}

boot(DUR, render);
</script>
</body>
</html>
